<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书架</title>
    <style>
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        .category-btn {
            padding: 8px 16px;
            background: #e0e0e0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .category-btn:hover {
            background: #d0d0d0;
        }
        .category-btn.active {
            background: #2c3e50;
            color: white;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .page-number {
            display: inline-block;
            margin: 0 5px;
            min-width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .page-number.current {
            background: #2c3e50;
            color: #2c3e50;
        }
        .page-number:hover:not(.current) {
            color: #2c3e50;
        }
        /* .extend {
            color: #2c3e50;
            margin: 0 5px;
            align-items: center;
        } */
        .extend:hover {
            color: #2c3e50;
        }

        .bookshelf {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        .book {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .book:hover {
            transform: translateY(-5px);
        }
        .book-cover {
            height: 300px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }
        .book-cover img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .book-info {
            padding: 15px;
        }
        .book-title {
            font-weight: bold;
            color: #2c3e50;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
            max-height: 2.8em;
        }

        @media (max-width: 600px) {
            .bookshelf {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <h1>我的书架</h1>
    <div class="controls">
        <!-- 书架分类 -->
        <div class="categories">
            <button class="category-btn active" data-category="all">全部</button>
            <button class="category-btn" data-category="programming">编程</button>
            <button class="category-btn" data-category="cs">计算机科学</button>
            <button class="category-btn" data-category="brand">品牌</button>
            <button class="category-btn" data-category="algorithm">算法</button>
            <button class="category-btn" data-category="bestsellers">畅销书</button>
        </div>
    </div>

    <div class="bookshelf">
        
        <!-- 畅销类书籍 -->
        <div class="book" data-category="bestsellers">
            <div class="book-cover"><img src="http://picbed.shijun0210.top/eBook-cover/洞察.jpeg" alt=""></div>
            <div class="book-info">
                <div class="book-title">洞察：精确观察和有效沟通的艺术</div>
            </div>
        </div>
        
        <!-- 品牌类书籍 -->
        <div class="book" data-category="brand">
            <div class="book-cover"><img src="http://picbed.shijun0210.top/eBook- cover/cultural strategy.jpeg"></div>
            <div class="book-info">
                <div class="book-title">cultural strategy: using innovative ideology to build breakthrough brands</div>
            </div>
        </div>
        
        <!-- 畅销类书籍 -->
        <div class="book" data-category="bestsellers">
            <div class="book-cover"><img src="http://picbed.shijun0210.top/eBook-cover/爆发.png"></div>
            <div class="book-info">
                <div class="book-title">爆发：大数据时代预见未来的新思维</div>
            </div>
        </div>
        
        
    
    
    </div>

<!-- 翻页功能 -->
<div class="pagination">
    <span class="page-number current">1</span>
    <a class="page-number" href="javascript:;">2</a>
    <a class="page-number" href="javascript:;">3</a>
    <a class="extend next" rel="next" href="javascript:;">
        <i class="fas fa-chevron-right fa-fw"></i>
    </a>
</div>

<script>
    const booksPerPage = 15;
    let currentPage = 1;
    let currentCategory = 'all';
        
    function updateBooksDisplay() {
        const books = document.querySelectorAll('.book');
        let visibleCount = 0;
        let totalVisible = 0;
        
        // 先计算可见书籍总数
        books.forEach(book => {
            if (currentCategory === 'all' || book.dataset.category === currentCategory) {
                totalVisible++;
            }
        });
        
        // 更新分页信息
        const totalPages = Math.max(1, Math.ceil(totalVisible / booksPerPage));
        
        // 更新书籍显示
        books.forEach((book, index) => {
            const showBook = (currentCategory === 'all' || book.dataset.category === currentCategory);
            const showOnPage = showBook && 
                                index >= (currentPage - 1) * booksPerPage && 
                                index < currentPage * booksPerPage;
            
            book.style.display = showOnPage ? 'block' : 'none';
            
            if (showBook && showOnPage) {
                visibleCount++;
            }
        });
        
        // 更新分页按钮
        const pagination = document.querySelector('.pagination');
        pagination.innerHTML = '';
        
        // 添加上一页按钮
        if (currentPage > 1) {
            const prevLink = document.createElement('a');
            prevLink.className = 'extend prev';
            prevLink.href = 'javascript:;';
        prevLink.innerHTML = '<i class="fas fa-chevron-left fa-fw"></i>';
        prevLink.addEventListener('click', () => {
            currentPage--;
            updateBooksDisplay();
        });
        pagination.appendChild(prevLink);
    }
        
        // 添加页码按钮
    for (let i = 1; i <= totalPages; i++) {
        const pageNum = document.createElement('span');
        pageNum.className = 'page-number';
        if (i === currentPage) {
            pageNum.classList.add('current');
        }
        pageNum.textContent = i;
        pageNum.addEventListener('click', () => {
            currentPage = i;
            updateBooksDisplay();
        });
        pagination.appendChild(pageNum);
    }
        
        // 添加下一页按钮
    if (currentPage < totalPages) {
        const nextLink = document.createElement('a');
        nextLink.className = 'extend next';
        nextLink.href = 'javascript:;';
        nextLink.innerHTML = '<i class="fas fa-chevron-right fa-fw"></i>';
        nextLink.addEventListener('click', () => {
            currentPage++;
            updateBooksDisplay();
        });
        pagination.appendChild(nextLink);
    }

        // 滚动到书架顶部
    document.querySelector('.controls').scrollIntoView({
        behavior: 'smooth'
    });
    }
    
    // 分类按钮点击事件
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.category;
            currentPage = 1;
            updateBooksDisplay();
        });
    });
    
    
    // 初始化显示
    updateBooksDisplay();
</script>
